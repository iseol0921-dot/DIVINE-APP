<title>디바인 차량 카탈로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: white mobile column (max 480px), list rows + hairlines, black as the action colour, Kakao yellow only for the chat banner. */
:root{
  --bg:#ffffff; --gray:#f5f5f5; --line:#ececec; --fg:#141414; --sub:#6b6b6b; --muted:#a6a6a6; --kakao:#fee500; --kakao-ink:#191600;
  --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.5;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
@media (min-width:500px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:6px;height:50px}
.hd.line{border-bottom:1px solid var(--line)}
.hd h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .ib{width:36px;height:36px;display:grid;place-items:center;margin:0 -6px}
.logo{flex:1}.logo img{height:20px;display:block}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:8;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;color:#b0b0b0;position:relative}
.tabbar button[aria-current="page"]{color:var(--fg)}
.tabbar .dot{position:absolute;top:5px;left:calc(50% + 7px);min-width:15px;height:15px;border-radius:8px;background:var(--fg);color:#fff;font-size:10px;line-height:15px;text-align:center;padding:0 4px}

.h3{font-size:16px;font-weight:600;margin:0}
.sub{color:var(--sub)} .muted{color:var(--muted)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.gap{height:10px;background:var(--gray);margin-block:22px}
.sec{padding-top:26px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.more{font-size:13px;color:var(--sub);display:inline-flex;align-items:center}
.more svg{width:14px;height:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:4px;font-weight:600;font-size:15px;width:100%}
.btn.pri{background:var(--fg);color:#fff}
.btn.out{border:1px solid #d4d4d4;background:var(--bg)}
.btn.sm{height:38px;font-size:13px;font-weight:500;width:auto;padding:0 14px}
.btn:disabled{background:#dcdcdc;color:#fff;cursor:not-allowed}
.req{font-size:11px;color:#d33;margin-left:3px}
.lbl{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.in{width:100%;min-width:0;height:46px;border:1px solid #dadada;border-radius:4px;padding:0 12px;background:var(--bg);font-size:15px}
textarea.in{height:auto;min-height:92px;padding:11px 12px;resize:vertical}
.in:focus{border-color:var(--fg);outline:none}
.in::placeholder{color:#bdbdbd}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl{display:flex;flex-direction:column;gap:16px}
.err{color:#d33;font-size:13px;margin:12px 0 0;min-height:1em}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.6}

.utabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.utabs::-webkit-scrollbar{display:none}
.utabs button{flex:none;padding:11px 0 10px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.utabs button[aria-selected="true"]{color:var(--fg);font-weight:600;border-color:var(--fg)}
.subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:12px}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:none;height:32px;padding:0 12px;border:1px solid #dedede;border-radius:16px;font-size:13px;color:var(--sub);white-space:nowrap}
.subs button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}

/* studio photo */
.ph{position:relative;overflow:hidden;display:block;width:100%;background:radial-gradient(120% 90% at 50% 30%,#ffffff 0%,#f3f3f3 55%,#e4e4e4 100%)}
.ph::before{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.035) 100%)}
.ph .car{position:absolute;inset:10% 6% 8%;display:block}
.ph .car img,.ph .car svg{width:100%;height:100%;object-fit:contain;display:block;position:relative}
.ph .car::after{content:"";position:absolute;left:12%;right:12%;bottom:2%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),rgba(0,0,0,0));z-index:0}
.ph .car>*{z-index:1}
.ph .tint{position:absolute;inset:0;z-index:2;mix-blend-mode:color;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.ph .wait{display:none;position:absolute;right:12px;bottom:10px;font-size:11px;color:#b5b5b5;z-index:3}
.gal .wait{display:block}

/* kakao banner */
.kakao{display:flex;align-items:center;gap:12px;background:var(--kakao);color:var(--kakao-ink);border-radius:6px;padding:14px 16px}
.kakao .bub{width:36px;height:36px;border-radius:50%;background:var(--kakao-ink);display:grid;place-items:center;flex:none}
.kakao .bub svg{width:20px;height:20px;fill:var(--kakao);stroke:none}
.kakao b{display:block;font-size:15px;font-weight:700;word-break:keep-all}
.kakao span span{font-size:12px;opacity:.75}
.kakao .go{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}

/* home */
.catrow{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.catrow button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;line-height:1.3;text-align:center;word-break:keep-all}
.catrow .ic{width:52px;height:52px;border-radius:14px;background:var(--gray);display:grid;place-items:center}
.catrow .ic svg{width:28px;height:28px;stroke-width:1.3}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:4px;background:var(--gray);padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.search svg{color:var(--muted);width:19px;height:19px}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.hs::-webkit-scrollbar{display:none}
.hcard{flex:none;width:160px}
.hcard .ph{aspect-ratio:4/3;border-radius:4px}

/* list rows */
.lrow{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;align-items:center}
.lrow .ph{width:120px;aspect-ratio:4/3;border-radius:4px;flex:none}
.lrow .tx{flex:1;min-width:0}
.lab{font-size:12px;color:var(--muted)}
.nm{font-size:15px;font-weight:500;line-height:1.4;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:16px;font-weight:700;margin-top:4px}
.pr small{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}

/* detail */
.gal{aspect-ratio:4/3}
.swatch{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-block:14px 2px}
.swatch::-webkit-scrollbar{display:none}
.swatch button,.swatch label{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);position:relative}
.swatch button[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--fg)}
.swatch .orig{background:conic-gradient(#e33,#fc3,#3c6,#39f,#93f,#e33)}
.swatch label{display:grid;place-items:center;background:var(--bg);color:var(--sub);cursor:pointer}
.swatch label svg{width:16px;height:16px}
.swatch label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.dt h2{font-size:21px;font-weight:700;margin:4px 0 0;line-height:1.4}
.price-l{display:flex;align-items:baseline;gap:4px;margin-top:14px}
.price-l b{font-size:24px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.tbl th{font-weight:400;color:var(--sub);text-align:left;padding:10px 0;border-bottom:1px solid var(--line);width:42%}
.tbl td{padding:10px 0;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.terms{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:#444;line-height:1.65}
.terms li{padding-left:10px;position:relative;margin-bottom:6px}
.terms li::before{content:"";position:absolute;left:0;top:.7em;width:3px;height:3px;border-radius:50%;background:#999}
.bot{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;padding-block:8px;margin-top:26px}
.bot .favb{width:50px;flex:none;border:1px solid #d4d4d4;border-radius:4px;display:grid;place-items:center}
.bot .favb[aria-pressed="true"] svg{fill:currentColor}

/* design */
.cv{aspect-ratio:16/10}
.seg{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid #d4d4d4;border-radius:4px;overflow:hidden;margin-top:16px}
.seg button{height:40px;font-size:14px;color:var(--sub);text-align:center}
.seg button+button{border-left:1px solid #d4d4d4}
.seg button[aria-selected="true"]{background:var(--fg);color:#fff;font-weight:600}
.up{display:flex;align-items:center;justify-content:center;gap:8px;height:92px;border:1px dashed #cfcfcf;border-radius:4px;color:var(--sub);font-size:13px;position:relative;margin-top:10px;cursor:pointer}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up img{max-height:60px}
.chk{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.chk input{width:19px;height:19px;accent-color:var(--fg);margin:0}
.chk span{flex:1}
.sw{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:13px;background:#d9d9d9;transition:.15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.sw input:checked+i{background:var(--fg)}
.sw input:checked+i::after{left:21px}

/* inquiry */
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ci .ph{width:72px;aspect-ratio:4/3;border-radius:4px;flex:none}
.ci .tx{flex:1;min-width:0;font-size:14px}
.ci .tx p{margin:1px 0;font-size:12px;color:var(--muted)}
.ci .x{color:var(--muted);width:28px;height:28px;display:grid;place-items:center}
.ci .x svg{width:17px;height:17px}
.tg{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tg>span:first-child{flex:1;font-size:14px}
.tg small{display:block;font-size:12px;color:var(--muted)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{height:36px;padding:0 13px;border:1px solid #dadada;border-radius:18px;font-size:13px;color:var(--sub)}
.opts button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--fg)}
.sumbar{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-block:10px;margin-top:26px}
.sumbar .row{font-size:13px;margin-bottom:8px}
.copy{display:flex;align-items:center;justify-content:space-between;padding:14px 0;font-size:15px;border-bottom:1px solid var(--line)}
.copy b{user-select:all;font-weight:600}

/* me / admin */
.menu{margin:0;padding:0;list-style:none}
.menu button,.menu a{display:flex;align-items:center;width:100%;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.menu span{flex:1}
.menu em{font-style:normal;font-size:13px;color:var(--muted)}
.menu svg{width:16px;height:16px;color:var(--muted)}
.qrow{padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.qrow .row{font-size:13px}
.state{font-size:12px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-top:10px;border:1px solid var(--line);border-radius:4px;padding:10px 2px}
.week small{font-size:11px;color:var(--muted)}
.week .d{width:30px;height:30px;margin:5px auto 0;border-radius:50%;display:grid;place-items:center;font-size:14px}
.week .d.today{background:var(--fg);color:#fff}
.week i{display:block;height:14px;font-style:normal;font-size:10px;color:var(--sub)}
.aq{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.aq .tx{flex:1;min-width:0;font-size:14px}
.aq .tx p{margin:0;font-size:12px;color:var(--muted)}
.aq select{border:1px solid #dadada;border-radius:4px;font-size:12px;padding:2px 4px;background:var(--bg)}
.mini{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%}
.mini .ph{width:60px;aspect-ratio:4/3;border-radius:3px;flex:none}
.mini .tx{flex:1;min-width:0;font-size:13px}
.mini .tx small{display:block;color:var(--muted);font-size:12px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:10px 10px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .hd{top:0}
.pics{display:flex;gap:8px;flex-wrap:wrap}
.pic{position:relative;width:80px;height:60px;border-radius:3px;overflow:hidden;background:var(--gray)}
.pic img{width:100%;height:100%;object-fit:contain}
.pic button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:3px;padding:0 5px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:4px;z-index:40;font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>
<div id="modal" class="scrim" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

  });

  return `${hdr("관리자",{line:true})}

    <div style="padding-top:18px"><h3 class="h3">이번 주 촬영</h3>
      <div class="week">${days.map(d=>`<div><small>${"일월화수목금토"[d.getDay()]}</small><div class="d num ${iso(d)===iso(now)?"today":""}">${d.getDate()}</div><i>${bk.has(iso(d))?bk.get(iso(d))+"건":""}</i></div>`).join("")}</div></div>
    <div class="sec"><div class="row"><h3 class="h3">예약·결제</h3><span class="small muted">${db.quotes.length}건</span></div>
      ${db.quotes.length?[...db.quotes].reverse().map(q=>`<div class="aq"><div class="tx">${esc(q.client)} · ${esc(q.phone)}<p>${esc(q.date)} ${esc(q.time||"")} · ${esc(q.place)}</p><p>${esc(q.cars.map(id=>car(id)?.name).filter(Boolean).join(", "))}</p><p style="color:var(--fg)">${q.total?won(q.total)+" · "+esc(q.method||""):""}</p></div>
        <select data-qstat="${q.id}" aria-label="진행 상태">${["결제 완료","배차 확정","촬영 완료","취소·환불"].map(s=>`<option ${q.status===s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")
      :`<p class="sub small" style="padding:12px 0;margin:0">아직 들어온 예약이 없어요.</p>`}</div>
    ${db.consults.length?`<div class="sec"><h3 class="h3">차량제작문의</h3>${[...db.consults].reverse().map(m=>`<div class="qrow"><b>${esc(m.model||"차종 미정")}</b> <span class="small sub">${esc(m.cats.join(", "))}</span><div class="small sub">${esc(m.name)} · ${esc(m.phone)} · ${esc(m.created)}</div></div>`).join("")}</div>`:""}
    <div class="sec"><div class="row"><h3 class="h3">차량·금액 관리 <span class="muted num">${db.cars.length}</span></h3><button class="btn pri sm" data-act="newcar">차량 등록</button></div>
      ${db.cars.map(c=>`<button class="mini" data-edit="${c.id}"><span class="ph">${studio(c)}</span><span class="tx">${esc(c.name)}<small>${esc(catLabel(c.cat))} · ${esc(c.sub)} · ${man(c.rent)}</small></span></button>`).join("")}</div>
    <div class="sec"><button class="btn out" data-act="reset">단가표 원본으로 되돌리기</button><button class="btn out" style="margin-top:8px" data-act="logout">관리자 나가기</button></div>
  </div><div style="height:24px"></div>`;
}

function sheet(h){ const m=$("#modal"); m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`; m.hidden=false; document.body.style.overflow="hidden"; }
function closeSheet(){ $("#modal").hidden=true; $("#modal").innerHTML=""; document.body.style.overflow=""; }
const sheetTop = t => `<header class="hd pad line"><h1>${t}</h1><button class="ib" data-close aria-label="닫기">${ic(IC.close)}</button></header>`;
function pinSheet(){ sheet(`${sheetTop("관리자")}<form class="pad" id="pinForm" style="padding-top:18px"><label class="lbl" for="pinIn">비밀번호 4자리 (시안용 0000)</label><input class="in num" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" style="letter-spacing:.4em;text-align:center;font-size:20px"><p class="err" id="pinErr"></p><button class="btn pri">확인</button></form>`);
  $("#pinIn").focus();
  $("#pinForm").onsubmit=e=>{e.preventDefault(); if($("#pinIn").value===ADMIN_PIN){ui.admin=true;closeSheet();push({type:"admin"});} else $("#pinErr").textContent="비밀번호가 맞지 않아요.";}; }
let draft=[];
function carSheet(id){ const c=id?car(id):{cat:"prop",sub:"",body:"sedan"};
  draft=[...(c.photos||[])];
  sheet(`${sheetTop(id?"차량 수정":"차량 등록")}<form class="pad fl" id="carForm" style="padding-top:18px">
    <div><label class="lbl" for="f-name">차종<span class="req">*</span></label><input class="in" id="f-name" name="name" required value="${esc(c.name)}"></div>
    <div class="f2"><div><label class="lbl" for="f-cat">카테고리</label><select class="in" id="f-cat" name="cat">${CAR_CATS.map(x=>`<option value="${x.id}" ${x.id===c.cat?"selected":""}>${esc(x.label)}</option>`).join("")}</select></div>
    <div><label class="lbl" for="f-sub">구분</label><input class="in" id="f-sub" name="sub" value="${esc(c.sub)}" placeholder="국산 중형"></div></div>
    <div class="f2"><div><label class="lbl" for="f-rent">대여료 (만원)</label><input class="in" id="f-rent" name="rent" type="number" min="0" value="${esc(c.rent)}" placeholder="비우면 협의"></div>
    <div><label class="lbl" for="f-single">일회성 대여 (만원)</label><input class="in" id="f-single" name="single" type="number" min="0" value="${esc(typeof c.single==="number"?c.single:"")}"></div></div>
    <div class="f2"><div><label class="lbl" for="f-km">초과 km당</label><input class="in" id="f-km" name="km" value="${esc(c.km)}" placeholder="500원"></div>
    <div><label class="lbl" for="f-hours">기본 시간</label><input class="in" id="f-hours" name="hours" value="${esc(c.hours||"6시간")}"></div></div>
    <div><span class="lbl">사진 (배경 없는 누끼 PNG 권장, 첫 장이 대표)</span><div class="pics" id="pics"></div><input type="file" id="f-photos" accept="image/*" multiple style="margin-top:10px"></div>
    <div><label class="lbl" for="f-body">사진 없을 때 모양</label><select class="in" id="f-body" name="body">${[["sedan","세단"],["small","경차"],["suv","SUV"],["van","승합"],["truck","트럭"],["bus","버스"],["super","스포츠카"],["classic","클래식"],["taxi","택시"],["police","경찰차"],["ambulance","구급차"],["bike","오토바이"]].map(([v,l])=>`<option value="${v}" ${v===c.body?"selected":""}>${l}</option>`).join("")}</select></div>
    <p class="err" id="delMsg" style="margin:0"></p>
    <div style="display:flex;gap:8px">${id?`<button type="button" class="btn out" id="delBtn" style="width:96px;color:#d33">삭제</button>`:""}<button class="btn pri">저장</button></div></form>`);
  const draw=()=>{ $("#pics").innerHTML=draft.map((p,i)=>`<div class="pic"><img src="${p}" alt="사진 ${i+1}"><button type="button" data-rm="${i}" aria-label="사진 ${i+1} 빼기">✕</button></div>`).join("")||`<span class="small muted">사진 없음</span>`;
    $("#pics").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm,1);draw();}); }; draw();
  $("#f-photos").onchange=async e=>{ for(const f of e.target.files) draft.push(await shrink(f,1200)); e.target.value=""; draw(); };
  $("#carForm").onsubmit=e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(e.target));
    d.rent=d.rent===""?null:Number(d.rent); d.single=d.single===""?null:Number(d.single); d.photos=draft;
    if(id) Object.assign(car(id),d); else db.cars.unshift({id:"n"+Date.now(),...d});
    if(save()){ closeSheet(); render(); toast(id?"수정했어요":"등록했어요"); } };
  let armed=false; if(id) $("#delBtn").onclick=()=>{ if(!armed){armed=true;$("#delBtn").textContent="한 번 더";$("#delMsg").textContent="한 번 더 누르면 삭제돼요.";return;}
    db.cars=db.cars.filter(x=>x.id!==id); db.cart=db.cart.filter(x=>x.car!==id); save(); closeSheet(); if(ui.stack.at(-1)?.type==="detail") ui.stack.pop(); render(); toast("삭제했어요"); };
}
function shrink(file,max){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/im.width), cv=document.createElement("canvas"); cv.width=im.width*s; cv.height=im.height*s; cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); res(cv.toDataURL(file.type==="image/png"?"image/png":"image/jpeg",.82)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

function buildItem(id,design){ const prev=db.cart.find(x=>x.car===id);
  if(!design){ const d={color:ui.color,logo:ui.dl.logo,text:ui.dl.text,opts:[]}; const it={days:structuredClone(ui.dl.days),svc:[...ui.dl.svc],memo:ui.dl.memo,mode:ui.dl.mode,night:ui.dl.night,hours:ui.dl.hours,nights:ui.dl.nights,meals:ui.dl.meals,opts:[...ui.dl.opts],car:id,options:designSummary(d),design:(d.color||d.logo||d.text)?d:null}; return it; } const it={mode:prev?.mode||"rent",hours:prev?.hours||baseHours(car(id)),night:prev?.night,nights:prev?.nights||0,meals:prev?.meals||0,opts:prev?.opts||[],car:id,options:design?designSummary(design):(ui.color?designSummary({color:ui.color}):[]),design:design?{...design}:(ui.color?{color:ui.color}:null)}; return it; }
function addCart(id,design){ const it=buildItem(id,design); const i=db.cart.findIndex(x=>x.car===id); i>=0?db.cart[i]=it:db.cart.push(it); save(); }
const bookList=()=>ui.direct||db.cart;
function bind(){
  const q=$("#q"); if(q) q.oninput=e=>{ ui.q=e.target.value; const r=catList(); $("#list").innerHTML=r.length?r.map(lrow).join(""):`<p class="empty">해당하는 차량이 없어요.</p>`; };
  const hq=$("#homeq"); if(hq) hq.onkeydown=e=>{ if(e.key==="Enter"&&hq.value.trim()){ ui.q=hq.value; go("category"); } };
  const so=$("#sort"); if(so) so.onchange=e=>{ ui.sort=e.target.value; render(); };
  document.querySelectorAll('input[name="pm"]').forEach(r=>r.onchange=()=>{ ui.pm=r.value; render(); });
  const dlg=$("#dlogo"); if(dlg) dlg.onchange=async e=>{ const f=e.target.files[0]; if(f){ ui.dl.logo=await shrink(f,400); if(!ui.dl.opts.includes("wlogo")&&!ui.dl.opts.includes("wfull")) ui.dl.opts.push("wlogo"); render(); } };
  const dt2=$("#dtext2"); if(dt2) dt2.oninput=e=>{ ui.dl.text=e.target.value; $("#gal").innerHTML=studio(car(ui.stack.at(-1).id),{color:ui.color,logo:ui.dl.logo,text:ui.dl.text}); };
  const est=()=>{ const e=$("#dlest"); if(e) e.textContent=dlEstimate(car(ui.stack.at(-1).id)); };
  document.querySelectorAll("[data-dopt]").forEach(x=>x.onchange=()=>{ const k=x.dataset.dopt; ui.dl.opts=x.checked?[...ui.dl.opts,k]:ui.dl.opts.filter(o=>o!==k); est(); });
  [["dl-hours","hours"],["dl-nights","nights"],["dl-meals","meals"]].forEach(([id,k])=>{ const el=$("#"+id); if(el) el.oninput=()=>{ ui.dl[k]=Math.max(0,Number(el.value)||0); est(); }; });
  document.querySelectorAll("[data-dsvc]").forEach(x=>x.onchange=()=>{ const k=x.dataset.dsvc; ui.dl.svc=x.checked?[...ui.dl.svc,k]:ui.dl.svc.filter(o=>o!==k); est(); });
  document.querySelectorAll("[data-dnight]").forEach(el=>el.onchange=()=>{ ui.dl.days[+el.dataset.dnight].night=el.checked; est(); });
  document.querySelectorAll("[data-day]").forEach(el=>el.oninput=el.onchange=()=>{ ui.dl.days[+el.dataset.day][el.dataset.f]=el.value; });
  const dm=$("#dl-memo"); if(dm) dm.oninput=()=>{ ui.dl.memo=dm.value; };
  const dn=$("#dl-night"); if(dn) dn.onchange=()=>{ ui.dl.night=dn.checked; est(); };
  const pk=$("#pick"); if(pk) pk.onchange=e=>{ ui.color=e.target.value; render(); };
  const d=ui.design;
  const lg=$("#logo"); if(lg) lg.onchange=async e=>{ const f=e.target.files[0]; if(f){ d.logo=await shrink(f,400); render(); } };
  const dt=$("#dtext"); if(dt) dt.oninput=e=>{ d.text=e.target.value; $("#pv").innerHTML=studio(car(d.car),{color:d.color,logo:d.logo,text:d.text}); };
  document.querySelectorAll("[data-opt]").forEach(x=>x.onchange=()=>{ const v=x.dataset.opt; d.opts=x.checked?[...d.opts,v]:d.opts.filter(o=>o!==v); });
  const qf=$("#qform"); if(qf){ const recalc=()=>{ const q=quote(cartItems(),ui.form); $("#calc").innerHTML=calcBlock(q); $("#qtotal").textContent=cartItems().length&&!q.blocked.length?won(q.total):"-"; };
    qf.oninput=qf.onchange=e=>{ const t=e.target;
      if(t.dataset.mode!==undefined){ bookList()[+t.dataset.mode].mode=t.value; save(); return recalc(); }
      if(t.dataset.iopt!==undefined){ const it=bookList()[+t.dataset.iopt]; it.opts=t.checked?[...(it.opts||[]),t.value]:(it.opts||[]).filter(k=>k!==t.value); save(); return recalc(); }
      if(t.name){ ui.form[t.name]=t.type==="checkbox"?t.checked:t.value; if(["hours","night","nights","meals"].includes(t.name)) recalc(); } };
    qf.onsubmit=e=>{ e.preventDefault(); const f=ui.form; const miss=[["name","이름/회사명"],["phone","연락처"]].filter(([k])=>!String(f[k]||"").trim()).map(([,l])=>l);
      const noDate=cartItems().filter(({it})=>!(it.days||[]).length||(it.days||[]).some(d=>!d.date||!String(d.place||"").trim()));
      if(noDate.length) miss.push(`${noDate.map(x=>x.c.name.split(" · ")[0]).join(", ")}의 촬영 날짜·장소(차량 화면에서 입력)`);
      if(miss.length){ $("#qerr").textContent=`${miss.join(", ")}을(를) 입력해 주세요.`; return; }
      const items=cartItems(), q=quote(items,f);
      if(q.blocked.length){ $("#qerr").textContent="금액 협의 차량은 카카오톡 상담 후 결제할 수 있어요. 해당 차량을 빼고 결제해 주세요."; return; }
      if(!f.agree){ $("#qerr").textContent="취소 규정과 이용 기준에 동의해 주세요."; return; }
      ui.pending={...f,date:(()=>{const ds=cartItems().flatMap(x=>(x.it.days||[]).map(d=>d.date)).filter(Boolean).sort(); return ds.length>1?ds[0]+" ~ "+ds.at(-1):ds[0]||"";})(),place:[...new Set(cartItems().flatMap(x=>(x.it.days||[]).filter(d=>d.type!=="wait").map(d=>d.place)).filter(Boolean))].join(", "),items:items.map(x=>({...x.it})),carNames:items.map(x=>x.c.name),lines:q.lines.map(g=>({car:g.car.name,lines:g.lines})),supply:q.supply,vat:q.vat,total:q.total};
      push({type:"pay"}); }; }
  const mf=$("#mform"); if(mf){ const f=ui.mform;
    mf.oninput=e=>{ const k={"m-model":"model","m-era":"era","m-color":"color","m-memo":"memo","m-name":"name","m-phone":"phone"}[e.target.id]; if(k) f[k]=e.target.value; };
    $("#m-img").onchange=async e=>{ const x=e.target.files[0]; if(x){ f.img=await shrink(x,800); render(); } };
    mf.onsubmit=e=>{ e.preventDefault(); if(!String(f.name||"").trim()||!String(f.phone||"").trim()){ $("#merr").textContent="이름/회사와 연락처를 입력해 주세요."; return; }
      db.consults.push({...f,created:new Date().toLocaleDateString("sv-SE")}); ui.mform={cats:["차량 섭외"]}; save(); render(); toast("제작 문의를 보냈어요"); }; }
  document.querySelectorAll("[data-qstat]").forEach(s=>s.onchange=()=>{ db.quotes.find(x=>x.id===s.dataset.qstat).status=s.value; save(); toast(`“${s.value}”(으)로 바꿨어요`); });
}
document.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return; const ds=t.dataset;
  if(t.closest("#modal")){ if(ds.close!==undefined) closeSheet(); return; }
  if(ds.tab) return go(ds.tab);
  if(ds.act==="back") return back();
  if(ds.open){ ui.color=null; ui.dl=newDl(car(ds.open)); return push({type:"detail",id:ds.open}); }
  if(ds.cat){ if(ui.tab==="category"&&!ui.stack.length&&!CATS.find(c=>c.id===ds.cat)?.inquiry){ ui.cat=ds.cat; ui.sub="전체"; ui.q=""; return render(); } return openCat(ds.cat); }
  if(ds.sub!==undefined){ ui.sub=ds.sub; return render(); }
  if(ds.color!==undefined){ ui.color=ds.color||null; const v=ui.stack.at(-1);  document.querySelectorAll("[data-color]").forEach(b=>b.getAttribute("aria-pressed")!==null&&b.setAttribute("aria-pressed",b.dataset.color===ui.color)); return render(); }
  if(ds.dcolor){ ui.design.color=ui.design.color===ds.dcolor?null:ds.dcolor; return render(); }
  if(ds.fav){ const i=db.favs.indexOf(ds.fav); i>=0?db.favs.splice(i,1):db.favs.push(ds.fav); save(); render(); return toast(i>=0?"찜을 해제했어요":"찜했어요"); }
  if(ds.addcart){ addCart(ds.addcart); render(); return toast("예약함에 담았어요"); }
  if(ds.book){ if(car(ds.book).rent==null){ ui.inq="call"; return go("inquiry"); } ui.direct=[buildItem(ds.book)]; return push({type:"book"}); }
  if(ds.customize){ ui.design={car:ds.customize,color:ui.color,logo:null,text:"",opts:[]}; ui.dtab="wrap"; return push({type:"design"}); }
  if(ds.dtab){ ui.dtab=ds.dtab; return render(); }
  if(ds.dtype){ const [i,ty]=ds.dtype.split(":"); ui.dl.days[+i].type=ty; return rerenderKeep(); }
  if(ds.rmday){ ui.dl.days.splice(+ds.rmday,1); return rerenderKeep(); }
  if(ds.dmode){ ui.dl.mode=ds.dmode; return render(); }
  if(ds.inq){ ui.inq=ds.inq; return render(); }
  if(ds.rmcart){ bookList().splice(+ds.rmcart,1); save(); return render(); }
  if(ds.kind){ ui.form.kind=ui.form.kind===ds.kind?null:ds.kind; return render(); }
  if(ds.mcat){ const f=ui.mform; f.cats=f.cats.includes(ds.mcat)?f.cats.filter(x=>x!==ds.mcat):[...f.cats,ds.mcat]; return render(); }
  if(ds.loaddesign){ ui.design=structuredClone(db.designs[+ds.loaddesign]); ui.dtab="wrap"; return push({type:"design"}); }
  if(ds.edit) return carSheet(ds.edit);
  if(ds.copy){ const v=ds.copy; try{ navigator.clipboard.writeText(v).then(()=>toast("복사했어요"),()=>toast("길게 눌러 복사해 주세요")); }catch(_){ toast("길게 눌러 복사해 주세요"); } return; }
  switch(ds.act){
    case "addday": { const last=ui.dl.days.at(-1); let nd=""; if(last?.date){ const d=new Date(last.date); d.setDate(d.getDate()+1); nd=d.toLocaleDateString("sv-SE"); } ui.dl.days.push({date:nd,type:"shoot",place:last?.place||"",time:last?.time||""}); return rerenderKeep(); }
    case "terms": return push({type:"terms"});
    case "paynow": { const b=ui.pending; if(!b) return; const no="DV"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+String(db.quotes.length+1).padStart(3,"0");
      db.quotes.push({id:"q"+Date.now(),no,client:b.name,phone:b.phone,cars:b.items.map(x=>x.car),items:b.items,date:b.date,time:b.time,place:b.place,hours:b.hours,night:!!b.night,kind:b.kind,memo:b.memo,lines:b.lines,supply:b.supply,vat:b.vat,total:b.total,method:ui.pm,status:"결제 완료",created:new Date().toLocaleDateString("sv-SE")});
      if(ui.direct) ui.direct=null; else db.cart=[]; ui.form={hours:6,nights:0,meals:0}; ui.pending=null; save(); ui.stack=[{type:"done"}]; render(); return scrollTo(0,0); }
    case "favs": return push({type:"favs"});
    case "admin": return ui.admin?push({type:"admin"}):pinSheet();
    case "logout": ui.admin=false; return go("me");
    case "newcar": return carSheet(null);
    case "rmdlogo": ui.dl.logo=null; return render();
    case "rmlogo": ui.design.logo=null; return render();
    case "savedesign": db.designs.unshift(structuredClone(ui.design)); if(save()) toast("내정보에 저장했어요"); return;
    case "designquote": ui.direct=[buildItem(ui.design.car,ui.design)]; return push({type:"book"});
    case "cart": ui.direct=null; return push({type:"book"});
    case "addmore": return go("category");
    case "reset": if(ds.armed){ Object.assign(db,fresh()); save(); render(); return toast("단가표 원본으로 되돌렸어요"); } t.dataset.armed="1"; t.textContent="한 번 더 누르면 수정 내용이 모두 지워져요"; return;
  }
});
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&!$("#modal").hidden) closeSheet(); });
render();
</script>
